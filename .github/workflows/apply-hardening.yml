name: Apply security hardening

on:
  push:
    branches:
      - security-hardening-20260928

permissions:
  contents: write

concurrency:
  group: apply-security-hardening
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged changes
        shell: bash
        run: |
          set -euo pipefail
          cat .hardening/part-* | base64 --decode > /tmp/hardening-changes.tar.gz
          tar -xzf /tmp/hardening-changes.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .hardening
          rm -f .github/workflows/apply-hardening.yml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend and API
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Validate diff
        run: git diff --check

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: harden auth and data integrity"
          git push origin HEAD:${GITHUB_REF_NAME}
